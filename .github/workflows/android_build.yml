name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    environment: GOOGLE_SERVICES_JSON
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools" "ndk;27.1.12297006" "cmake;3.22.1"
          yes | sdkmanager --licenses > /dev/null
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Install dependencies
        run: npm ci

      - name: Verify environment files
        run: |
          if [ ! -f "android/app/google-services.json" ]; then
            echo "Error: android/app/google-services.json is missing!"
            exit 1
          fi
          if [ ! -f ".env" ]; then
            echo "Error: .env file is missing!"
            exit 1
          fi

      - name: Build Android
        run: npm run build:android
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/**/*.apk
