name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    outputs:
      artifact_path: android/app/build/outputs/apk/release/app-release.apk
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build Android
        run: npm run build:android
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/**/*.apk

  generate-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: actions/checkout@v4
      - name: Install Pandoc and LaTeX
        run: sudo apt-get install -y pandoc texlive-latex-base texlive-latex-recommended texlive-fonts-recommended texlive-xetex fonts-noto-color-emoji
      - name: Generate PDFs
        run: |
          mkdir -p dist/docs
          for file in *.md; do
            pandoc "$file" -o "dist/docs/${file%.md}.pdf" --pdf-engine=xelatex -V mainfont="DejaVu Sans" --metadata title="${file%.md}"
          done
          cp logo/logo.png dist/docs/
      - name: Upload Docs
        uses: actions/upload-artifact@v4
        with:
          name: project-docs
          path: dist/docs/
